StylesPath = .styles

MinAlertLevel = suggestion

Packages = Hugo

[*.{md}]
BasedOnStyles = Vale, Google, write-good, proselint, alex, Joblint

# code comments — vale extracts and lints comments only for these
# extensions. Lighter style set than prose: Joblint is job-posting
# specific, Google is too strict for comments.
[*.{c,cc,cpp,cs,css,ex,exs,go,h,hpp,java,js,jsx,kt,lua,php,py,rb,rs,scala,sh,swift,ts,tsx}]
BasedOnStyles = Vale, write-good, proselint, alex

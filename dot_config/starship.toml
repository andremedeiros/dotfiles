add_newline = false
format = "$directory$git_branch$git_status$git_state$cmd_duration $character"

[directory]
fish_style_pwd_dir_length = 1
style = "bright-blue"
format = "[$path]($style)"

[git_branch]
format = "[( $branch)]($style)"
style = "bright-yellow"

[git_status]
format = "[($conflicted$staged$modified)](red)"
conflicted = "="
modified = "*"
staged = "!"

[git_state]
format = "[ $state( $progress_current/$progress_total)](red)"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[cmd_duration]
format = "[( $duration)]($style)"
style = "fg:196"
